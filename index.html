<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta Prekinder B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: una sola columna tipo ficha bancaria, cada dato con su botón Copiar */
:root{
  --bg:#f3f6fb; --card:#ffffff; --fg:#1d2a3a; --muted:#5d6b7c; --line:#dfe6ef;
  --accent:#2f6fd6; --accent-fg:#ffffff; --ok:#1f8a4c;
  --display:"Fredoka",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121821; --card:#1b2330; --fg:#e8eef6; --muted:#9aa8ba; --line:#2b3646;
  --accent:#6fa0f0; --accent-fg:#0d1420; --ok:#5cc98a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --card:#1b2330; --fg:#e8eef6; --muted:#9aa8ba; --line:#2b3646;
  --accent:#6fa0f0; --accent-fg:#0d1420; --ok:#5cc98a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;margin:0}
main{max-width:480px;margin:0 auto;padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:600;font-size:1.9rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.all{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);
  font:700 1.1rem var(--body);padding:18px;cursor:pointer;width:100%}
.all:focus-visible,.cp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.txt{flex:1;min-width:0}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.val{font-weight:600;font-size:1.15rem;word-break:break-word;user-select:all;font-variant-numeric:tabular-nums}
.cp{appearance:none;background:transparent;border:1.5px solid var(--accent);color:var(--accent);
  border-radius:9px;font:700 .95rem var(--body);padding:10px 14px;cursor:pointer;flex-shrink:0}
.cp.done,.all.done{border-color:var(--ok);color:var(--ok)}
.all.done{background:var(--ok);color:var(--card)}
.note{color:var(--muted);font-size:.85rem;margin:0}
</style>

</head>
<body>
<main>
  <header>
    <h1>Cuenta Curso Prekinder B</h1>
    <p class="sub">Toca un dato para copiarlo y pégalo en tu banco.</p>
  </header>

  <button class="all" id="copyAll" type="button">Copiar todos los datos</button>

  <div class="card" id="list"></div>

  <p class="note">Si el botón no copia, mantén presionado el dato para seleccionarlo.</p>
</main>

<script>
const datos=[
  ["Nombre","Valeria Andrea Martínez Leiva"],
  ["RUT","17318545-6"],
  ["Banco","Mercado Pago"],
  ["Tipo de cuenta","Cuenta Vista"],
  ["Número de cuenta","1081086215"],
  ["Correo","iae.apoderados@gmail.com"]
];
const list=document.getElementById("list");
function sel(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function copy(text,btn,el,label){
  const ok=()=>{btn.textContent="Copiado ✓";btn.classList.add("done");
    setTimeout(()=>{btn.textContent=label;btn.classList.remove("done")},1600)};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(()=>{if(el)sel(el)});
  } else if(el) sel(el);
}
datos.forEach(([k,v])=>{
  const row=document.createElement("div");row.className="row";
  row.innerHTML='<div class="txt"><div class="lbl"></div><div class="val"></div></div><button class="cp" type="button">Copiar</button>';
  row.querySelector(".lbl").textContent=k;
  const val=row.querySelector(".val");val.textContent=v;
  const b=row.querySelector(".cp");b.addEventListener("click",()=>copy(v,b,val,"Copiar"));
  list.appendChild(row);
});
const all=document.getElementById("copyAll");
all.addEventListener("click",()=>copy(datos.map(d=>d[0]+": "+d[1]).join("\n"),all,list,"Copiar todos los datos"));
</script>
</body>
</html>
